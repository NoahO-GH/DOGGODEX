<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOGGODEX</title>
    
    <!-- LINK FOR THE WEBSITE TAB ICON -->
    <!-- This points to the favicon file uploaded in the main GitHub directory -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    
    <style>
        /* SITE GLOBAL SETUP */
        /* Configures a smooth vertical scroll animation across the entire web document */
        html {
            scroll-behavior: smooth;
            background-color: #0a192f;
        }
        
        /* LAYOUT CORE STYLING */
        /* Positions the elements vertically down the center of the dark blue layout screen */
        body {
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-y: auto; 
        }

        /* LIVE SCROLLABLE EMBED FRAME CONTROLLER */
        /* Locks the card proportions using padding-top to keep the layout from overlapping */
        .embed-container {
            position: relative;
            width: 100%;
            max-width: 700px; 
            height: 0;
            padding-top: 133.3333%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border-radius: 12px;
            overflow: hidden;
            background-color: #020c1b;
            margin-bottom: 20px;
        }

        /* IFRAME HARDWARE INTEGRATION CONTAINER */
        /* Forces the external Canva asset grid to scale perfectly within the box parameters */
        .embed-container iframe {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            border: none;
        }

        /* TEXT LINK FOR PORTFOLIO CREDITS */
        /* Formats the baseline signature link using a clean monospaced interaction look */
        .credit-link {
            color: #8892b0;
            text-decoration: none;
            font-family: sans-serif;
            font-size: 14px;
            margin-top: 10px;
        }
        
        .credit-link:hover {
            color: #64ffda;
        }
    </style>
</head>
<body>

    <!-- PRIMARY WEB DISPLAY CONTENT -->
    <!-- The main responsive container displaying the complete multi-page overview scroll -->
    <!-- The URL has been updated to the bypass-authorized embed format to stop the connection block -->
    <div class="embed-container">
        <iframe loading="lazy" src="https://canva.com" allowfullscreen="allowfullscreen" allow="fullscreen">
        </iframe>
    </div>

    <!-- MAIN INTERACTIVE REPOSITORY EXTERNAL LINK -->
    <!-- Clicking this text routes visitors straight to the master design page view -->
    <a class="credit-link" href="https://canva.com" target="_blank" rel="noopener">DOGGODEX by Noah .O</a>

</body>
</html>
