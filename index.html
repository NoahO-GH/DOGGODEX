<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOGGODEX</title>
    
    <!-- LINK FOR THE WEBSITE TAB ICON -->
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    
    <style>
        /* SITE GLOBAL SETUP */
        html {
            scroll-behavior: smooth;
            background-color: #0a192f;
        }
        
        /* LAYOUT CORE STYLING */
        body {
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-y: auto; 
        }

        /* RESPONSIVE POKEDEX CARD CONTROLLER */
        .dex-page {
            width: 100%;
            max-width: 600px; 
            height: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border-radius: 12px;
            margin-bottom: 40px;
            display: block;
        }

        /* TEXT LINK FOR PORTFOLIO CREDITS */
        .credit-link {
            color: #8892b0;
            text-decoration: none;
            font-family: sans-serif;
            font-size: 14px;
            margin-top: 10px;
            margin-bottom: 20px;
        }
        
        .credit-link:hover {
            color: #64ffda;
        }
    </style>
</head>
<body>

    <!-- PRIMARY DISPLAY CONTENT -->
    <!-- These match your exact repository filenames including numbers and capitalization -->
    <img class="dex-page" src="./INTRO.png" alt="Doggodex Overview">
    <img class="dex-page" src="./001 CORGI.png" alt="No. 001 Corgi Profile">
    <img class="dex-page" src="./002 HUSKY.png" alt="No. 002 Husky Profile">
    <img class="dex-page" src="./003 GOLDEN.png" alt="No. 003 Golden Retriever Profile">

    <!-- MAIN INTERACTIVE REPOSITORY SIGNATURE LINK -->
    <a class="credit-link" href="https://github.com" target="_blank" rel="noopener">DOGGODEX by Noah .O</a>
